name: Build Windows installer

# Запускается на каждый push в main + при ручном диспетче.
# Собирает Windows-приложение через Flutter, упаковывает в Inno Setup
# и публикует готовый KonstruktorStroenii-Setup-*.exe как:
#   1) Artifacts текущего workflow-run (всегда),
#   2) GitHub Release (только при push тэга вида v*).

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Run tests (smoke)
        run: flutter test --reporter=expanded
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify binary
        shell: pwsh
        run: |
          if (-not (Test-Path "build/windows/x64/runner/Release/konstruktor_stroenii.exe")) {
            Write-Error "konstruktor_stroenii.exe not found"
            exit 1
          }
          Get-ChildItem "build/windows/x64/runner/Release" -Recurse | Measure-Object -Property Length -Sum | Format-List

      - name: Locate Inno Setup
        id: iscc
        shell: pwsh
        run: |
          # На windows-latest runner Inno Setup 6 предустановлен
          # (`choco install innosetup` падает «newer version already installed»).
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress --force
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${{ steps.iscc.outputs.iscc }}"
          & "$iscc" installer\konstruktor_stroenii.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer\Output

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KonstruktorStroenii-Setup
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
